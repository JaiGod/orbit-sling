name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        run: |
          mkdir -p app/www
          cp index.html app/www/
          cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Orbit Sling" io.github.jaigod.orbitsling --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../OrbitSling.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Orbit Sling v1.0.0
          body: |
            Android debug build of Orbit Sling (sideload: enable "Install unknown apps").
            Play in your browser: https://jaigod.github.io/orbit-sling/
          files: OrbitSling.apk
          make_latest: true
